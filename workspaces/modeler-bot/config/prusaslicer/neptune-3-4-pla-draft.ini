# Neptune 3/4 draft validation profile for modeler-bot.
# Purpose: slicer dry-runs for fit, build-volume, and basic G-code generation checks.
# Final production tuning should be done against the exact printer, filament, and nozzle.

printer_settings_id = Elegoo Neptune 3/4 validation draft
print_settings_id = 0.20mm draft validation
filament_settings_id = PLA validation

printer_technology = FFF
bed_shape = 0x0,225x0,225x225,0x225
max_print_height = 265
gcode_flavor = marlin
nozzle_diameter = 0.4
filament_diameter = 1.75
extruders_count = 1

layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 5
fill_density = 15%
fill_pattern = gyroid
skirts = 1
brim_width = 0

filament_type = PLA
temperature = 200
first_layer_temperature = 205
bed_temperature = 60
first_layer_bed_temperature = 60

start_gcode = G90 ; absolute positioning\nM83 ; relative extrusion\nG28 ; home all axes\nG29 ; auto bed leveling\nM104 S[first_layer_temperature]\nM140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0
end_gcode = M104 S0\nM140 S0\nG92 E0\nG1 E-2 F2400\nG1 X0 Y220 F3000\nM84
