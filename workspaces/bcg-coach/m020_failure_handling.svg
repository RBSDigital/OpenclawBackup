<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#34495e"/></marker></defs><rect width="1000" height="850" fill="white"/><text x="500" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Unknown-outcome control</text><text x="500" y="62" text-anchor="middle" font-family="Arial" font-size="14" fill="#566573">Prevent duplicate charges after a connectivity failure</text><g font-family="Arial" text-anchor="middle"><rect x="250" y="100" width="500" height="90" rx="14" fill="#fadbd8" stroke="#c0392b" stroke-width="3"/><text x="500" y="155" font-size="21" font-weight="bold">Transaction outcome unknown</text><rect x="250" y="260" width="500" height="100" rx="14" fill="#fcf3cf" stroke="#b7950b" stroke-width="3"/><text x="500" y="302" font-size="19" font-weight="bold">Check gateway status</text><text x="500" y="330" font-size="15">using the transaction reference</text><polygon points="500,430 650,520 500,610 350,520" fill="#f5eef8" stroke="#8e44ad" stroke-width="3"/><text x="500" y="515" font-size="18" font-weight="bold">Final status</text><text x="500" y="542" font-size="18" font-weight="bold">known?</text><rect x="45" y="690" width="350" height="100" rx="14" fill="#d5f5e3" stroke="#239b56" stroke-width="3"/><text x="220" y="733" font-size="18" font-weight="bold">Reconcile and notify</text><text x="220" y="760" font-size="14">approved / declined / reversed</text><rect x="605" y="690" width="350" height="100" rx="14" fill="#fadbd8" stroke="#c0392b" stroke-width="3"/><text x="780" y="733" font-size="18" font-weight="bold">Do not blindly retry</text><text x="780" y="760" font-size="14">escalate, poll or investigate</text></g><g stroke="#34495e" stroke-width="3" marker-end="url(#a)" fill="none"><path d="M500 190 V260"/><path d="M500 360 V430"/><path d="M380 560 L220 690"/><path d="M620 560 