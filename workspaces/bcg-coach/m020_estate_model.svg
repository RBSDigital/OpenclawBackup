<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#34495e"/></marker></defs><rect width="1000" height="850" fill="white"/><text x="500" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">M020 field estate model</text><text x="500" y="62" text-anchor="middle" font-family="Arial" font-size="14" fill="#566573">Approximately 50 representatives</text><g font-family="Arial" text-anchor="middle"><rect x="180" y="100" width="640" height="180" rx="14" fill="#f5eef8" stroke="#8e44ad" stroke-width="3"/><text x="500" y="140" font-size="20" font-weight="bold">Central operations</text><text x="500" y="175" font-size="15">Merchant account and MID ownership</text><text x="500" y="200" font-size="15">Device inventory and serial register</text><text x="500" y="225" font-size="15">NMI registration, support and reporting</text><rect x="240" y="365" width="520" height="100" rx="14" fill="#fcf3cf" stroke="#b7950b" stroke-width="3"/><text x="500" y="407" font-size="20" font-weight="bold">Representative host device + 121 app</text><text x="500" y="435" font-size="15">Standardised configuration and pairing</text><rect x="240" y="550" width="520" height="100" rx="14" fill="#d5f5e3" stroke="#239b56" stroke-width="3"/><text x="500" y="592" font-size="20" font-weight="bold">One assigned M020 reader per representative</text><text x="500" y="620" font-size="15">Serialised, charged and supportable</text><rect x="240" y="735" width="520" height="80" rx="14" fill="#eaf2f8" stroke="#2e86c1" stroke-width="3"/><text x="500" y="783" font-size="20" font-weight="bold">Customer-present card transaction</text></g><g stroke="#34495e" stroke-width="3" marker-end="url(#a)" fill="none"><path d="M500 280 V365"/><path d="M500 465 V550"/><path d="M500 650 V735"/></g><g font-family="Arial" font-size="13" fill="#34495e" text-an